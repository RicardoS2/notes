name: Disparar Atualização do Quartz

on:
  push:
    branches: [main]

jobs:
  disparar:
    name: Notificar Repositório do Quartz
    runs-on: ubuntu-latest
    steps:
      - name: Enviar evento repository_dispatch para o Quartz
        run: |
          echo "Iniciando a notificação para o repositório do Quartz..."
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.QUARTZ_TRIGGER_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/RicardoS2/lab-eco-log-dos-bolsistas-/dispatches \
            -d '{"event_type":"sync-notes"}'
          echo "Notificação entregue com sucesso ao Quartz!"